onboarding = false
[keys]
prefix = "ctrl+a"

# Pane navigation — matches tmux's `bind h/j/k/l -> select-pane -L/-D/-U/-R`.
# These are herdr's own v0.7.5 defaults; spelled out explicitly so they don't
# silently drift if a future herdr version changes its defaults.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

[ui]
show_agent_labels_on_pane_borders = true

agent_panel_sort = "spaces"

# Show the session's task title instead of the project directory name
# ("stow-config") in the sidebar agent rows.
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", { token = "terminal_title_stripped", fg = "#AAAAAA" }], ["workspace", "tab"]]

[ui.toast]
delivery = "system"

[experimental]
pane_history = false

[theme]
name = "one-dark"
auto_switch = false
